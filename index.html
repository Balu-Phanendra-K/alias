<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goodbye.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #101113;
    --text: #f3f1ec;
    --muted: #858585;
    --accent: #c8ae8c;
}

/* Base */

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
}

/* Full-screen animated GIF background */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(10, 10, 12, 0.30),
            rgba(10, 10, 12, 0.45)
        ),
        url("8c4facbb4bcf5d65b4c679431181b49a.gif");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -2;
    transform: scale(1.02);
}

/* Golden ambient glow */

body::after {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: rgba(200,174,140,0.07);
    filter: blur(120px);
    border-radius: 50%;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: -1;
}

/* Header */

header {
    width: 100%;
    padding: 30px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 2;
}

.logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #c0b9b1;
    font-size: 11px;
    letter-spacing: 2px;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #b77b70;
    box-shadow: 0 0 10px rgba(183,123,112,0.6);
}

/* Main content */

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 70px 20px;
    position: relative;
    z-index: 1;
}

.container {
    width: 100%;
    max-width: 680px;
    text-align: center;
    animation: appear 1.2s ease forwards;
}

.eyebrow {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 5px;
    font-weight: 500;
    margin-bottom: 25px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 9vw, 86px);
    font-weight: 400;
    letter-spacing: -3px;
    line-height: 1.1;
    margin-bottom: 20px;
    text-shadow: 0 3px 25px rgba(0,0,0,0.3);
}

h1 span {
    color: var(--accent);
    font-style: italic;
}

.description {
    color: #c0bdb9;
    font-size: 15px;
    line-height: 1.9;
    max-width: 440px;
    margin: 0 auto 40px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

/* Goodbye caption */
.gif-caption a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(200,174,140,0.4);
    padding-bottom: 3px;
    transition: all 0.3s ease;
}

.gif-caption a:hover {
    color: #f3f1ec;
    border-bottom-color: #f3f1ec;
}

/* Footer */

footer {
    padding: 25px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.12);
    color: #aaa39c;
    font-size: 11px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
}

footer a {
    color: #d0c3b5;
    text-decoration: none;
    transition: color .3s;
}

footer a:hover {
    color: var(--accent);
}

/* Animation */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile responsiveness */

@media (max-width: 600px) {

    header {
        padding: 25px 6%;
    }

    main {
        padding: 65px 22px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .description {
        font-size: 14px;
    }

    footer {
        padding: 22px 6%;
        gap: 15px;
        flex-direction: column;
        text-align: center;
    }

    body::before {
        background-position: 55% center;
    }
}

</style>
<link rel="icon" type="image/png" href="icon.jpg">

</head>

<body>

<header>

    <div class="logo">THE END.</div>

    <div class="status">
        <span class="dot"></span>
        NO LONGER IN SERVICE
    </div>

</header>

<main>

    <div class="container">

        <div class="eyebrow">
            A LITTLE ANNOUNCEMENT
        </div>

        <h1>
            <span>Goodbye.</span>
        </h1>

        <p class="description">
            Thank you for three years of amazing support and suggestions that helped shape the PR tool.
			Now, it's time for me to officially retire the tool.
        </p>

      <p class="gif-caption">
    Have something to say?
    <a href="mailto:baluphanendra108@email.com">
        Write me an email ↗
    </a>
</p>

    </div>

</main>



<script>

// Automatically update copyright year

document.getElementById("year").textContent =
    new Date().getFullYear();

// Page entrance animation

window.addEventListener("load", () => {
    document.body.classList.add("loaded");
});

</script>

</body>
</html>
