<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="encrypted.css">

    <title>PR Optimizer</title>
    <link rel="shortcut icon" type="image/png" href="icc.png">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <script src="gate.js" defer></script>
</head>

<body>

    <!-- PASSWORD SCREEN -->
    <div id="passwordScreen">

        <div class="password-card">

            <div class="lock-icon">
                <i class="fas fa-lock"></i>
            </div>

            <h2>Restricted Access</h2>

            <p>Enter your access password to continue.</p>

            <div class="time-info">
                <i class="far fa-clock"></i>
                <span id="timePeriod">Checking access period...</span>
            </div>

            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="accessPassword"
                    placeholder="Enter password"
                    autocomplete="off"
                >

                <button type="button" id="togglePassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <button id="loginButton">
                <i class="fas fa-unlock-alt"></i> Unlock Access
            </button>

            <p id="errorMessage"></p>

            <div class="access-footer">
                AUTHORIZED ACCESS ONLY
            </div>

        </div>

    </div>


    <!-- ACTUAL WEBSITE CONTENT -->
    <div id="appContent" style="display:none;">

        <h5>
            <mark1>
                Note: Alias inside MSO code are also considered as duplicates.
                Please ignore them in case an error shows up.
            </mark1>
        </h5>

        <a href="https://github.com/Balu-Phanendra-K/alias"
           target="_blank"
           id="topRightButton">
            <i class="fab fa-github"></i>
            Visit GitHub
        </a>

        <div class="container">

            <h1>
                <mark>Quick Peer Review Optimizer</mark>
            </h1>

            <textarea
                id="htmlInput"
                placeholder="Paste your HTML code here">
            </textarea>

            <br>

            <button id="checkButton">
                <b>Validate</b>
            </button>

            <button id="previewBtn" onclick="togglePreview()">
                Preview
            </button>

            <button id="printAliasesButton">
                <b>List Aliases & Links</b>
            </button>

            <div id="result"></div>
            <br>

            <div id="preview"></div>

        </div>

    </div>

</body>
</html>
