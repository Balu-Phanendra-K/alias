<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="encrypted.css">

    <title>PR Optimizer</title>
    <link rel="shortcut icon" type="image/png" href="icc.png">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <script src="gate.js" defer></script>
    <style>
        /* PASSWORD SCREEN */

#passwordScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #f4f6f9;
    font-family: 'Poppins', sans-serif;
}

.password-card {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 40px 30px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
}

.lock-icon {
    width: 65px;
    height: 65px;
    background: #edf2ff;
    color: #3568c0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin: 0 auto 20px;
}

.password-card h2 {
    font-size: 23px;
    margin-bottom: 8px;
    color: #222;
}

.password-card p {
    color: #777;
    font-size: 13px;
}

.time-info {
    margin: 22px 0;
    padding: 12px;
    background: #f5f7fb;
    border-radius: 7px;
    font-size: 13px;
    color: #3568c0;
}

.password-input-wrapper {
    display: flex;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: hidden;
    margin-bottom: 15px;
}

.password-input-wrapper input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 14px;
}

.password-input-wrapper button {
    background: white;
    color: #777;
    border: none;
    padding: 0 15px;
    cursor: pointer;
}

#loginButton {
    width: 100%;
    padding: 13px;
    background: #3568c0;
    color: white;
    border: none;
    border-radius: 7px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
}

#loginButton:hover {
    background: #244f9c;
}

#loginButton:disabled {
    opacity: 0.7;
    cursor: wait;
}

#errorMessage {
    color: #dc3545;
    font-size: 12px;
    margin-top: 15px;
}

.access-footer {
    border-top: 1px solid #eee;
    padding-top: 20px;
    margin-top: 25px;
    color: #aaa;
    font-size: 10px;
    letter-spacing: 2px;
}
    </style>
</head>

<body>

    <!-- PASSWORD SCREEN -->
    <div id="passwordScreen">

        <div class="password-card">

            <div class="lock-icon">
                <i class="fas fa-lock"></i>
            </div>

            <h2>Restricted Access</h2>

            <p>Enter your access password to continue.</p>

            <div class="time-info">
                <i class="far fa-clock"></i>
                <span id="timePeriod">Checking access period...</span>
            </div>

            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="accessPassword"
                    placeholder="Enter password"
                    autocomplete="off"
                >

                <button type="button" id="togglePassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <button id="loginButton">
                <i class="fas fa-unlock-alt"></i> Unlock Access
            </button>

            <p id="errorMessage"></p>

            <div class="access-footer">
                AUTHORIZED ACCESS ONLY
            </div>

        </div>

    </div>


    <!-- ACTUAL WEBSITE CONTENT -->
    <div id="appContent" style="display:none;">

        <h5>
            <mark1>
                Note: Alias inside MSO code are also considered as duplicates.
                Please ignore them in case an error shows up.
            </mark1>
        </h5>

        <a href="https://github.com/Balu-Phanendra-K/alias"
           target="_blank"
           id="topRightButton">
            <i class="fab fa-github"></i>
            Visit GitHub
        </a>

        <div class="container">

            <h1>
                <mark>Quick Peer Review Optimizer</mark>
            </h1>

            <textarea
                id="htmlInput"
                placeholder="Paste your HTML code here">
            </textarea>

            <br>

            <button id="checkButton">
                <b>Validate</b>
            </button>

            <button id="previewBtn" onclick="togglePreview()">
                Preview
            </button>

            <button id="printAliasesButton">
                <b>List Aliases & Links</b>
            </button>

            <div id="result"></div>
            <br>

            <div id="preview"></div>

        </div>

    </div>

</body>
</html>
